plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ocr.fastscan'
    compileSdk 35

    defaultConfig {
        applicationId "com.ocr.fastscan"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "com.google.android.material:material:1.12.0"
    // Рекомендую добавить AppCompat для совместимости UI
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    // 1. CameraX (Камера)
    def camerax_version = "1.3.4" // Используем стабильную версию
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // 2. ML Kit (Распознавание штрихкодов и текста)
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'

    // 3. Настройки (Preferences)
    implementation "androidx.preference:preference-ktx:1.2.1"
    // --- Сеть и API (Retrofit) ---
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // --- Firebase (Firestore & BOM) ---
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-firestore-ktx'

    // --- Генерация штрих-кодов (для печати) ---
    implementation 'com.google.zxing:core:3.5.3'

    // --- Утилиты и Жизненный цикл ---
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastscan}
      POSTGRES_USER: ${POSTGRES_USER:-fastscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastscan}
    ports:
      - "5432:5432"
    volumes:
      - fastscan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastscan} -d ${POSTGRES_DB:-fastscan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - path: ./bot/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_VERSION: ${APP_VERSION:-0.4.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fastscan}:${POSTGRES_PASSWORD:-fastscan}@postgres:5432/${POSTGRES_DB:-fastscan}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-only-refresh-secret-change-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-LmsMalagaBot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      FASTSCAN_BOT_API_SECRET: ${FASTSCAN_BOT_API_SECRET:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    env_file:
      - path: ./bot/.env
        required: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      FASTSCAN_API_URL: http://api:8080
      FASTSCAN_BOT_API_SECRET: ${FASTSCAN_BOT_API_SECRET:-}

volumes:
  fastscan_postgres_data:

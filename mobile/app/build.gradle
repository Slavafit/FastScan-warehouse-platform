plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ocr.fastscan'
    compileSdk 35

    defaultConfig {
        applicationId "com.ocr.fastscan"
        minSdk 24
        targetSdk 34
        versionCode 38
        versionName "4.9"
        manifestPlaceholders = [appLabel: "FastScan Pro"]
        buildConfigField "String", "LICENSE_APPLICATION_ID", '"com.ocr.fastscan"'
        buildConfigField "String", "LICENSE_APPLICATION_NAME", '"FastScan Pro"'
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders.appLabel = "FastScan Dev"
        }
        release {
            manifestPlaceholders.appLabel = "FastScan Pro"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        // Set Java 17 for the Java compiler
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        // Set Java 17 for the Kotlin compiler
        jvmTarget = '17'
    }
}

dependencies {
    // UI & Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'


    // CameraX
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation "androidx.camera:camera-view:1.3.1"

    // ML Kit updated versions
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'

    // Network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Printing and barcodes
    implementation 'com.google.zxing:core:3.5.3'
    //ProgressDialog dependency
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation libs.androidx.recyclerview
    //implementation libs.androidx.media3.common.ktx
    implementation("androidx.media3:media3-common-ktx:1.5.0")
}
